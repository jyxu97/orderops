name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Deployment is manual on purpose — see the deploy job.
  workflow_dispatch:

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: orderops
  ECS_CLUSTER: orderops
  JAVA_VERSION: '21'
  NODE_VERSION: '22'

jobs:
  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'corretto'
          cache: 'maven'

      # Includes the DynamoDB Local integration tests. The harness starts DynamoDB Local via
      # the Docker CLI when a daemon is reachable and falls back to downloading the JAR when it
      # is not, so this needs no service container.
      - name: Unit and integration tests
        run: mvn -f apps/orderops/pom.xml test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: apps/orderops/target/surefire-reports/
          retention-days: 7

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: apps/web

      # Separate steps rather than one chained command, so a failure names itself in the run
      # summary instead of showing up as "npm exited 1".
      - name: Lint
        run: npm run lint
        working-directory: apps/web

      - name: Typecheck
        run: npm run typecheck
        working-directory: apps/web

      - name: Test
        run: npm run test
        working-directory: apps/web

      - name: Build
        run: npm run build
        working-directory: apps/web

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 7

  # ── Image build (verification only on PRs) ────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # Builds without pushing, so a Dockerfile that no longer builds fails the PR rather than
      # the deploy. Nothing here touches AWS, so it needs no credentials.
      - name: Build the API/worker image
        run: docker build -t orderops:ci apps/orderops/

      - name: Build the web image
        run: docker build -t orderops-web:ci apps/web/

  # ── Deploy ────────────────────────────────────────────────────────────────
  #
  # Manual (`workflow_dispatch`) rather than on every push to main. This repository deploys to a
  # personal AWS account, where an accidental deploy costs real money and can take the
  # environment down while nobody is watching. The gate is deliberate, not missing: every check
  # above still runs on each push, so main is always known-good and deployable.
  deploy:
    name: Deploy to AWS
    if: github.event_name == 'workflow_dispatch'
    needs: [backend, frontend, docker]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # One image, two services. The API and the worker are the same jar behind APP_MODE, so
      # building twice would only create a chance for them to diverge.
      - name: Build and push the image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            apps/orderops/
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy the API service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: infra/ecs/api-task-def.json
          service: orderops-api
          cluster: ${{ env.ECS_CLUSTER }}
          image: ${{ steps.build-image.outputs.image }}
          container-name: orderops
          # Blocks until ECS reports the service steady. Combined with the container health
          # check, a task that starts and immediately fails its probe fails this step rather
          # than being reported as a successful deploy.
          wait-for-service-stability: true

      - name: Deploy the worker service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: infra/ecs/worker-task-def.json
          service: orderops-worker
          cluster: ${{ env.ECS_CLUSTER }}
          image: ${{ steps.build-image.outputs.image }}
          container-name: orderops
          wait-for-service-stability: true

      # ── Frontend ──────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Build the web app
        run: |
          npm ci
          npm run build
        working-directory: apps/web
        env:
          # Left empty on purpose: CloudFront fronts the ALB on the same distribution, so the
          # app talks to its own origin and needs no absolute API host baked in.
          VITE_API_BASE_URL: ''
          VITE_WS_URL: ''

      - name: Sync to S3
        run: |
          # Hashed assets first with a long max-age, then index.html with no-cache. In that
          # order a client that fetches the new index.html always finds the assets it names —
          # the reverse order leaves a window serving an index that points at missing files.
          aws s3 sync apps/web/dist/ "s3://${{ vars.FRONTEND_BUCKET }}/" \
            --delete --exclude index.html \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp apps/web/dist/index.html "s3://${{ vars.FRONTEND_BUCKET }}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate the CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION }}" \
            --paths "/index.html" "/"

      # ── Verify ────────────────────────────────────────────────────────────
      - name: Smoke test
        env:
          # Against the ALB, not CloudFront: a cached response could make a dead backend look
          # alive, which is exactly what this step exists to catch.
          BASE_URL: ${{ vars.ALB_BASE_URL }}
        run: bash infra/smoke-test.sh
