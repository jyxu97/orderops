server:
  port: 8080

aws:
  region: ${AWS_REGION:us-west-2}

dynamodb:
  endpoint: ${DYNAMODB_ENDPOINT:http://localhost:8000}

tables:
  orders:    ${ORDER_TABLE_NAME:Orders}
  inventory: ${INVENTORY_TABLE_NAME:Inventory}
  idempotency: ${IDEMPOTENCY_TABLE_NAME:IdempotencyRecords}
  audit:     ${AUDIT_TABLE_NAME:OrderAuditLogs}

sqs:
  endpoint: ${SQS_ENDPOINT:http://localhost:4566}
  fulfillment-queue-url: ${FULFILLMENT_QUEUE_URL:http://localhost:4566/000000000000/order-fulfillment-queue}
  fulfillment-dlq-url: ${FULFILLMENT_DLQ_URL:http://localhost:4566/000000000000/order-fulfillment-dlq}

app:
  mode: ${APP_MODE:api}
  cors:
    # Vite dev server by default; set CORS_ALLOWED_ORIGINS to the CloudFront domain in AWS.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

realtime:
  redis-bridge:
    # The API subscribes to the Redis order-event channel to fan events out over WebSocket.
    enabled: ${REALTIME_REDIS_BRIDGE_ENABLED:true}

ops:
  queue-health:
    # Any DLQ message is a warning on its own, so only the main-queue backlog needs a threshold.
    backlog-threshold: ${OPS_BACKLOG_THRESHOLD:100}

simulator:
  payment:
    failure-mode: ${PAYMENT_FAILURE_MODE:NONE}
  shipment:
    failure-mode: ${SHIPMENT_FAILURE_MODE:NONE}
  failure-rate: ${FULFILLMENT_FAILURE_RATE:0.0}

spring:
  application:
    name: orderops
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always
      group:
        # Probed by the ECS container health check and the ALB target group.
        #
        # Deliberately excludes redis. Redis is a degradable dependency here: the idempotency
        # fast path falls back to DynamoDB and real-time fan-out reconnects on its own, so a
        # Redis outage costs live updates, not the ability to take orders. If the probe failed
        # on it, ECS would kill and replace every API task while Redis was down and turn a
        # partial degradation into a total outage.
        #
        # The trade-off is a weaker probe: it reports process liveness, not end-to-end
        # readiness. That is the right side to err on for a restart-triggering check — the full
        # /actuator/health still reports redis DOWN for dashboards and alarms.
        serving:
          include: ping, diskSpace
