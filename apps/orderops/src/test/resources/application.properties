# Test defaults. Loaded alongside the main application.yml (.properties wins on conflicts),
# so this file overrides only what tests need to differ.

# Tests mock StringRedisTemplate and have no Redis server. The bridge no longer fails startup
# when Redis is unreachable, but leaving it on would just have every test retry a doomed
# subscription on a timer; RedisEventBridgeStarterTest covers that path directly instead.
realtime.redis-bridge.enabled=false
